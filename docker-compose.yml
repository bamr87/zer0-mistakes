# Feature: ZER0-002
# ==============================================================================
# Docker Compose - Development
# ==============================================================================
# 
# Zero Version Pin Strategy - Development Environment
# 
# Philosophy:
#   - No version pins anywhere → always use latest compatible versions
#   - Bundler + Docker Hub resolve latest compatible at build time
#   - Production gets exactly what passed TEST (via immutable image tags)
# 
# Usage:
#   docker compose up              # Start development server (minimal image)
#   docker compose up --build      # Rebuild with latest dependencies
#   docker compose -f docker-compose.yml -f docker-compose.dev-full.yml up  # Use dev-full with tools
#   docker compose exec jekyll bash  # Access container shell
# 
# For testing: docker compose -f docker-compose.yml -f docker-compose.test.yml up
# For production: See docker-compose.prod.yml (use immutable tags only!)
# ==============================================================================

services:
  jekyll:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # dev-test is the stage with the full Jekyll + tooling toolchain; the
      # leaner `base` stage lacks `COPY . .` and cannot serve the site.
      target: dev-test

    # NOTE: no `platform:` pin. Forcing linux/amd64 ran the whole image under
    # QEMU emulation on arm64 (Apple Silicon) hosts — a 3-10x slowdown on
    # apt/bundle/native-gem work. Docker builds the native arch by default and
    # Jekyll serves identically. Export DOCKER_DEFAULT_PLATFORM=linux/amd64 if
    # you specifically need x86 parity with production.

    # Run bundle check first; skip install if deps haven't changed.
    # Statistics are NOT regenerated on every start — _data/content_statistics.yml
    # is committed and read directly; refresh on demand with `rake stats:generate`
    # (or _data/generate_statistics.sh) when content changes.
    # JEKYLL_LIVERELOAD=0 serves without LiveReload: no --livereload flag, and
    # _config_snapshots.yml layered last, since _config_dev.yml turns it on.
    # test/update-snapshots.sh sets it: its `npm ci` writes into this same bind
    # mount after the watcher starts, and LiveReload then reloaded pages
    # mid-snapshot (#461).
    command: ["sh", "-c", "lr=--livereload; cfg=_config.yml,_config_dev.yml; [ \"$${JEKYLL_LIVERELOAD:-1}\" = 0 ] && lr= && cfg=$$cfg,_config_snapshots.yml; git config --global --add safe.directory /site 2>/dev/null || true && (bundle check || bundle install --jobs 4 --retry 3) && bundle exec jekyll serve --watch $$lr --config $$cfg --host 0.0.0.0 --port 4000"]
    
    volumes:
      - .:/site
      # Named volume for bundle cache (faster rebuilds)
      - bundle_cache:/usr/local/bundle
      # Named volume for jekyll cache (avoids metadata regeneration)
      - jekyll_cache:/site/.jekyll-cache
    
    ports:
      - "127.0.0.1:${ZER0_MISTAKES_PORT:-4000}:4000"
      - "127.0.0.1:${ZER0_MISTAKES_LIVERELOAD_PORT:-35729}:35729"  # LiveReload port
    
    working_dir: /site
    
    environment:
      - JEKYLL_ENV=${JEKYLL_ENV:-development}
      - JEKYLL_LIVERELOAD=${JEKYLL_LIVERELOAD:-1}
      - BUNDLE_PATH=/usr/local/bundle
      # Repository info for jekyll-github-metadata gem
      - PAGES_REPO_NWO=${PAGES_REPO_NWO:-bamr87/zer0-mistakes}
    
    # Enable TTY for interactive commands
    stdin_open: true
    tty: true

  # zer0 studio — the Rails workbench beside the theme (studio/README.md):
  # token and skin editors, the theme doctor, docs-site previews, consumer
  # audits, the version lockstep and the pin matrix. Off by default:
  #   docker compose --profile studio up --build     → http://localhost:3300
  # It reaches this checkout at /theme and consumer checkouts at /sites
  # (SITES_DIR, default examples/), and shares bundle_cache with the jekyll
  # service so the theme's gems are installed once (the two images run the same
  # Ruby for that reason). Published on 127.0.0.1 only; the Docker gateway is
  # trusted because of that binding — set STUDIO_PASSWORD before publishing it
  # anywhere else.
  studio:
    build:
      context: ./studio
    profiles: [studio]
    ports:
      - "127.0.0.1:${STUDIO_PORT:-3300}:3000"
    volumes:
      - .:/theme
      - bundle_cache:/usr/local/bundle
      - ${SITES_DIR:-./examples}:/sites
      - studio_storage:/studio/storage
    environment:
      - THEME_DIR=/theme
      - SITES_DIR=/sites
      - THEME_BUNDLE_PATH=/usr/local/bundle
      - SOLID_QUEUE_IN_PUMA=1
      - STUDIO_TRUST_DOCKER_GATEWAY=1
      - STUDIO_PASSWORD=${STUDIO_PASSWORD:-}
      - STUDIO_USER=${STUDIO_USER:-}
      - SECRET_KEY_BASE=${STUDIO_SECRET_KEY_BASE:-}
      - PAGES_REPO_NWO=${PAGES_REPO_NWO:-bamr87/zer0-mistakes}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 12

volumes:
  bundle_cache:
    driver: local
  jekyll_cache:
    driver: local
  studio_storage:
    driver: local
