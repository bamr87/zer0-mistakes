# Solid Cable in development and production: Solid Queue forks its workers,
# and the async adapter cannot deliver a worker's Turbo Stream broadcast to a
# web thread in another process. The job pages tail live because of this.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
