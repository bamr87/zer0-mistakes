# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/zer0-mistakes
provenance: derived
summary: The zer0-mistakes theme's AI fleet — issue autopilot, content review, visual-evidence review, UI audit, CI self-repair and the @claude mention lane, all Claude Code (OAuth-first) through the shared claude-run action.
lanes:
- id: ai-content-review
  kind: review
  harness: claude-cli
  implementation: .github/workflows/ai-content-review.yml
  description: Content & Docs Review
  triggers:
  - kind: event
    events:
    - pull_request
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: ci-self-repair
  kind: other
  harness: claude-cli
  implementation: .github/workflows/ci-self-repair.yml
  description: CI self-repair
  triggers:
  - kind: event
    events:
    - workflow_run
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - RELEASE_PLEASE_TOKEN
  guardrails:
    never_merges: true
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: issue-autopilot
  kind: other
  harness: claude-cli
  implementation: .github/workflows/issue-autopilot.yml
  description: 🧭 Issue Autopilot
  triggers:
  - kind: schedule
    cron: 0 8 * * 1
  - kind: event
    events:
    - issues
  - kind: dispatch
  switch: ISSUE_AUTOCLOSE_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: ui-audit
  kind: analysis
  harness: claude-cli
  implementation: .github/workflows/ui-audit.yml
  description: UI/UX Audit
  triggers:
  - kind: schedule
    cron: 23 7 * * 1
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: visual-evidence-autogen
  kind: other
  harness: claude-cli
  implementation: .github/workflows/visual-evidence-autogen.yml
  description: Visual evidence autogen
  triggers:
  - kind: event
    events:
    - pull_request
  switch: VISUAL_EVIDENCE_AUTOGEN_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  - RELEASE_PLEASE_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - ai-content-review
  - ci-self-repair
  - claude
  - issue-autopilot
  - ui-audit
  - visual-evidence-autogen
- name: AUTO_PR_GITHUB_TOKEN
  scope: repo
  required: true
  used_by:
  - issue-autopilot
  - visual-evidence-autogen
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by 
`claude setup-token`.'
  used_by:
  - ai-content-review
  - ci-self-repair
  - claude
  - issue-autopilot
  - ui-audit
  - visual-evidence-autogen
- name: PAT_TOKEN
  scope: repo
  required: true
  used_by:
  - issue-autopilot
  - visual-evidence-autogen
- name: RELEASE_PLEASE_TOKEN
  scope: repo
  required: true
  used_by:
  - ci-self-repair
  - visual-evidence-autogen
agents:
- a11y-fixer
- agent-auditor
- code-fixer
- content-reviewer
- deps-bumper
- infra-scripts
- issue-resolver
- issue-triager
- issue-verifier
- plan-lens-dependency
- plan-lens-priority
- plan-lens-risk
- plan-lens-test
- test-author
- theme-ui
- ui-auditor
- visual-evidence-reviewer
skills:
- _shared
- issue-triage
- run-zer0-mistakes

