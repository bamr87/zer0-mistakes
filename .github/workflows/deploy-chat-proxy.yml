name: Deploy chat proxy

permissions:
  contents: read

concurrency:
  group: deploy-chat-proxy
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/deploy/chat-proxy/worker.js'
      - 'templates/deploy/chat-proxy/wrangler.toml'
      - '.github/workflows/deploy-chat-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fail-safe gate: without the Cloudflare secrets, wrangler dies with
      # "it's necessary to set a CLOUDFLARE_API_TOKEN" — which made EVERY run
      # of this workflow a guaranteed failure (7/7 failures 2026-06-15 →
      # 2026-07-07). Skip cleanly (with a notice) until the secrets exist.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured — skipping the chat-proxy deploy. Add both repo secrets to enable it."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.go == 'true'

      # Deploys the AI chat proxy Worker to Cloudflare.
      # Required GitHub Actions secrets:
      #   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" permission
      #   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
      # Claude auth: OAuth only (CLAUDE_CODE_OAUTH_TOKEN). ANTHROPIC_API_KEY disabled for now (2026-11-15); to restore, re-add the secrets.ANTHROPIC_API_KEY reference.
      # The Worker calls the Anthropic API directly (not Claude Code), so this
      # deploy no longer uploads ANTHROPIC_API_KEY as a Worker secret; it ships
      # code only and the Worker keeps whatever credential Cloudflare already
      # holds. To restore, add back `secrets: |` ANTHROPIC_API_KEY under `with:`
      # and `env: ANTHROPIC_API_KEY: <the secret>` on this step.
      # Optional (proxy-mode issue/PR creation): add a `secrets:` list with
      # GITHUB_TOKEN below and a CHAT_GITHUB_TOKEN repo secret mapped in env.
      - name: Deploy Worker to Cloudflare
        if: steps.creds.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: templates/deploy/chat-proxy
          wranglerVersion: '3'
