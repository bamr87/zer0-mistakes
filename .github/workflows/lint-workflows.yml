name: Lint workflows

# Self-lints the CI/CD definitions with actionlint (syntax, expression errors,
# deprecated action runners, shellcheck of run: scripts). Runs only when the
# workflow/action definitions change.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo rhysd/actionlint --json tagName -q .tagName)
          ver="${tag#v}"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${tag}/actionlint_${ver}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint

      - name: Run actionlint
        run: |
          # SC2086/SC2129/SC2035 are shellcheck quoting/style notes tracked as a
          # separate cleanup; this gate fails on real issues — invalid syntax,
          # bad workflow expressions, and deprecated/too-old action runners.
          "${RUNNER_TEMP}/actionlint" -color \
            -ignore 'SC2086' -ignore 'SC2129' -ignore 'SC2035'

      - name: Guard — "Quality Control" must always run
        run: |
          # Quality Control is the SINGLE required status check on `main` and holds
          # the version.rb<->Gemfile.lock consistency guard. It must run even on
          # docs-only PRs (where the code-path-filtered jobs are skipped) — a
          # required-but-skipped check would deadlock the repo's highest-volume PR
          # type. This pins that invariant so a future edit can't silently
          # re-introduce the deadlock (e.g. by re-splitting a path-filtered
          # fast-checks job out of quality-checks and gating on it).
          # See .github/instructions/version-control.instructions.md (Release model).
          python3 - <<'PY'
          import sys, yaml
          job = (yaml.safe_load(open('.github/workflows/ci.yml')) or {}) \
                  .get('jobs', {}).get('quality-checks', {})
          cond = str(job.get('if', ''))
          problems = []
          if not cond:
              problems.append("quality-checks job or its `if:` is missing")
          if 'always()' not in cond:
              problems.append("`if:` must contain always() so it runs on docs-only PRs")
          if 'fast-checks' in cond:
              problems.append("`if:` must NOT gate on a path-filtered job's result")
          if problems:
              print("::error file=.github/workflows/ci.yml::Quality Control always-runs "
                    "invariant broken: " + "; ".join(problems))
              sys.exit(1)
          print("OK — Quality Control always-runs invariant holds:", cond)
          PY

      - name: Guard — the pixel gate must see chrome-affecting data files
        run: |
          # `styling` gates the 9-skin Visual Snapshots job. It used to list only
          # code paths, while `_data/**` appeared under `content` — which gates no
          # visual job at all. So #419's navbar item changed the chrome of every
          # page with Visual Snapshots SKIPPED on both the PR and the main push,
          # and the drift surfaced later on #420, an unrelated PR. The pressure
          # there was to re-bless the baselines rather than diagnose, which is how
          # the original 1967px drift became permanently unrecoverable (#417).
          # A blessed regression and a green check are indistinguishable, so the
          # filter is pinned here rather than left to review.
          python3 - <<'PY'
          import re, sys, yaml

          CHROME_FILES = [
              '_data/navigation/main.yml',
              '_data/ui-text.yml',
              '_data/i18n/en.yml',
              '_data/theme_skins.yml',
              '_includes/components/theme-info.html',
              '_layouts/default.html',
              '_sass/main.scss',
          ]

          def glob_to_regex(pat):
              out, i = '', 0
              while i < len(pat):
                  if pat.startswith('**/', i):
                      out += '(?:.*/)?'; i += 3
                  elif pat.startswith('**', i):
                      out += '.*'; i += 2
                  elif pat[i] == '*':
                      out += '[^/]*'; i += 1
                  elif pat[i] == '?':
                      out += '[^/]'; i += 1
                  else:
                      out += re.escape(pat[i]); i += 1
              return re.compile('^' + out + '$')

          ci = yaml.safe_load(open('.github/workflows/ci.yml'))
          step = next(s for s in ci['jobs']['detect-changes']['steps']
                      if 'paths-filter' in str(s.get('uses', '')))
          styling = (yaml.safe_load(step['with']['filters']) or {}).get('styling') or []
          if not styling:
              print("::error file=.github/workflows/ci.yml::the `styling` filter is missing or empty")
              sys.exit(1)

          patterns = [glob_to_regex(p) for p in styling]
          missing = [f for f in CHROME_FILES if not any(rx.match(f) for rx in patterns)]
          if missing:
              print("::error file=.github/workflows/ci.yml::the `styling` filter (which gates "
                    "the 9-skin pixel tier) does not cover chrome-affecting file(s): "
                    + ", ".join(missing) + ". A change to one of these moves pixels on every "
                    "page while Visual Snapshots is skipped — that is issue #417.")
              sys.exit(1)
          print("OK — `styling` covers every chrome-affecting path:")
          for f in CHROME_FILES:
              print("   ", f)
          PY
