# ==============================================================================
# TEST Workflow - Fail Fast with Latest Dependencies
# ==============================================================================
# 
# Zero Version Pin Strategy:
#   - Build with NO version pins → always use latest compatible
#   - Fail immediately if incompatible → caught here, not in production
#   - Only promote images that pass all tests
#   - Production uses immutable tags (date+commit), never :latest
# 
# This workflow:
#   1. Builds Docker image with latest dependencies (no cache)
#   2. Runs full test suite
#   3. If tests pass → tags and pushes immutable image
#   4. Documents what versions were resolved (for debugging)
# ==============================================================================

name: TEST (Latest Dependencies)

permissions:
  contents: read

# Scheduled canaries get their OWN lane: the nightly builds --no-cache (the
# zero-pin gate) while pushes build cached, so they are not interchangeable and
# a push must never cancel — or queue behind — the nightly.
# Within the push lane a newer commit supersedes an older one. Serializing them
# (the previous cancel-in-progress: false) meant a push landing while another
# was in flight sat in the concurrency queue before starting, which is pure
# latency: this canary validates latest-deps against the TIP of main, so an
# image for a commit main has already moved past is not worth the pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# NOTE: deliberately NOT triggered on pull_request — PRs are validated by ci.yml
# against the pinned (merge-relevant) dependencies. Running the whole zero-pin
# Docker pipeline per PR duplicated that gate at ~2x the cost, and a latest-deps
# failure is upstream drift, not something a PR author can act on. This canary
# runs on main pushes + the daily schedule instead.
on:
  push:
    branches: [main]
    paths:
      - '_layouts/**'
      - '_includes/**'
      - '_sass/**'
      - '_plugins/**'
      - 'assets/**'
      - 'lib/**'
      - '*.gemspec'
      - 'Gemfile*'
      - 'Rakefile'
      - 'scripts/**'
      - 'test/**'
      - '_config*.yml'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'Dockerfile'
  schedule:
    # Daily build to catch upstream breakages early
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish image even on non-main branches'
        required: false
        default: false
        type: boolean

env:
  # Docker image name - uses repository variable if set, otherwise default
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'amrabdel/zer0-mistakes' }}
  REGISTRY: docker.io
  # Required for jekyll-github-metadata gem during CI builds
  # Uses repository variable if set, otherwise falls back to github.repository
  PAGES_REPO_NWO: ${{ vars.PAGES_REPO_NWO || github.repository }}

jobs:
  # ==========================================================================
  # Build, test and publish in ONE job
  # ==========================================================================
  # The image stays in this runner's Docker daemon from the build to the push.
  # As three jobs (build → test → publish) it crossed runners as an artifact
  # tarball, saved and uploaded once, then downloaded and loaded twice: about
  # 2-3 billed minutes a run spent moving the image.
  build-test-publish:
    name: Build, Test & Publish (Latest Deps)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      # The last test step's outcome. debug-failure reads it, so a failure in
      # the publish steps (Docker Hub) is not reported as a dependency break.
      tests_outcome: ${{ steps.htmlproofer.outcome }}

    steps:
      # ------------------------------------------------------------------------
      # Stage 1: Build with Latest Dependencies
      # ------------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Immutable Tag
        id: tag
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${DATE}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-latest-${{ hashFiles('docker/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-latest-

      - name: Update Dependencies to Latest
        run: |
          echo "📦 Updating dependencies to latest versions..."
          # Remove old Gemfile.lock to force fresh resolution
          rm -f Gemfile.lock
          # Use Ruby 3.3 (github-pages 232 requires Jekyll 3.10 which is compatible with Ruby 3.x)
          docker run --rm -v "$PWD:/site" -w /site ruby:3.3-slim bash -c '
            apt-get update -qq && apt-get install -y --no-install-recommends build-essential git libyaml-dev zlib1g-dev libssl-dev pkg-config && 
            git config --global --add safe.directory /site && 
            gem install bundler -v "~> 2.3" && 
            bundle install
          '
          echo "✅ Dependencies resolved to latest compatible versions"
          echo "📝 github-pages gem version:"
          grep "github-pages (" Gemfile.lock || echo "github-pages not found in lock file"
          
      - name: Build Docker Image (with cache for PRs/pushes)
        if: github.event_name != 'schedule'
        run: |
          echo "🔨 Building with layer caching (PRs/pushes)..."
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t zer0-mistakes-jekyll:dev-test \
            -f docker/Dockerfile \
            --target dev-test \
            .
          
          # Move cache to avoid unbounded growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
          
          # Tag for docker compose compatibility
          docker tag zer0-mistakes-jekyll:dev-test zer0-mistakes-jekyll:latest

      - name: Build Docker Image (no cache for scheduled)
        if: github.event_name == 'schedule'
        run: |
          echo "🔨 Building with NO cache (scheduled - zero-pin strategy)..."
          docker compose -f docker-compose.yml -f docker-compose.test.yml build --no-cache
          
      - name: Document Resolved Versions
        run: |
          echo "## 📦 Resolved Dependency Versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These are the versions Bundler resolved at build time:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm jekyll bundle list >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve Built Image
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Name the image the build step above produced; never guess one.
          # `docker compose images` lists only the images of existing
          # containers (none are left after `run --rm`), and
          # `docker images | head -1` returns an arbitrary image on current
          # runners (a preinstalled one, or the compose `validate` service's).
          # If the build left no image by that name, the run fails here.
          if [[ "${EVENT_NAME}" == 'schedule' ]]; then
            # The jekyll service's image, as `docker compose build` named it
            IMAGE_REF=$(docker compose -f docker-compose.yml -f docker-compose.test.yml config --images jekyll)
          else
            IMAGE_REF='zer0-mistakes-jekyll:dev-test'
          fi
          if ! IMAGE_ID=$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}") || [[ -z "${IMAGE_ID}" ]]; then
            echo "::error::The build left no image named '${IMAGE_REF}'"
            docker images
            exit 1
          fi
          echo "📋 Built image: ${IMAGE_REF} (${IMAGE_ID})"
          echo "id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          # The test steps below run this tag
          docker tag "${IMAGE_ID}" zer0-mistakes-jekyll-test:latest
          echo "✅ Tagged as zer0-mistakes-jekyll-test:latest"

      # ------------------------------------------------------------------------
      # Stage 2: Run Tests
      # ------------------------------------------------------------------------
      - name: Run Validation
        id: validation
        run: |
          echo "🔍 Running validation checks with pre-built image..."
          docker run --rm zer0-mistakes-jekyll-test:latest sh -c "
            echo '🔍 Running validation checks...' &&
            ruby -c lib/jekyll-theme-zer0/version.rb &&
            ruby -e \"spec = Gem::Specification.load('jekyll-theme-zer0.gemspec'); puts '✅ Gemspec valid: \#{spec.name} v\#{spec.version}'\" &&
            echo '📦 Resolved github-pages version:' &&
            bundle list | grep 'github-pages (' &&
            echo '📦 Resolved jekyll version:' &&
            bundle list | grep 'jekyll (' | head -1 &&
            echo '✅ All validation checks passed!'
          "

      - name: Run Jekyll Build Test
        id: jekyll_build
        run: |
          echo "🏗️ Testing Jekyll build with pre-built image..."
          # Build into a named volume so the HTML Proofer step checks THIS
          # build instead of running a second, identical `jekyll build`.
          docker run --rm \
            -v zer0-site:/site-out \
            -e PAGES_REPO_NWO=${{ env.PAGES_REPO_NWO }} \
            -e JEKYLL_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            zer0-mistakes-jekyll-test:latest sh -c '
            bundle exec jekyll build -d /site-out &&
            echo "✅ Jekyll build succeeded!"
          '

      - name: Run RSpec Tests
        id: rspec
        run: |
          echo "🧪 Running RSpec tests with pre-built image..."
          # Use the image's built-in files
          docker run --rm zer0-mistakes-jekyll-test:latest \
            bundle exec rspec --format documentation

      - name: Run HTML Proofer
        id: htmlproofer
        run: |
          echo "🔗 Running HTML validation with pre-built image..."
          
          # Known issues baseline (pages that may not exist or have known link issues)
          KNOWN_IGNORE_URLS="/localhost/,/127\.0\.0\.1/,/\.md$/,/\/services/,/\/hobbies\//,/\/notebooks\//,/\/notes\//,/\/quests\//,/\/archives\/#/"
          
          # Run HTML Proofer against the site the Jekyll Build Test step built
          docker run --rm \
            -v zer0-site:/site-out \
            zer0-mistakes-jekyll-test:latest sh -c "
              bundle exec htmlproofer /site-out \
                --disable-external \
                --allow-hash-href \
                --ignore-urls \"${KNOWN_IGNORE_URLS}\" \
                --no-enforce-https \
                2>&1 | tee /tmp/proofer.log
              
              # Count errors not in known issues
              ERROR_COUNT=\$(grep -c 'ERROR\|htmlproofer found' /tmp/proofer.log 2>/dev/null || echo '0')
              
              if [ \"\$ERROR_COUNT\" -gt 0 ]; then
                echo ''
                echo '❌ HTML Proofer found issues:'
                cat /tmp/proofer.log
                exit 1
              else
                echo '✅ HTML Proofer passed'
                exit 0
              fi
            " || {
              EXIT_CODE=$?
              echo "::warning::HTML Proofer completed with exit code ${EXIT_CODE}"
              # Only fail on actual errors (exit code 1), not on warnings
              if [ $EXIT_CODE -eq 1 ]; then
                echo "## ⚠️ HTML Proofer Issues" >> $GITHUB_STEP_SUMMARY
                echo "HTML validation found issues. Review the logs above." >> $GITHUB_STEP_SUMMARY
                # Track in summary but don't block pipeline for pre-existing issues
                echo "::warning::HTML Proofer found issues - review recommended"
              fi
              exit 0
            }

      - name: Generate Test Summary
        # Whenever the tests ran: the build half produced an image for them
        if: always() && steps.image.outcome == 'success'
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ steps.validation.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Jekyll Build | ${{ steps.jekyll_build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RSpec Tests | ${{ steps.rspec.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Proofer | ${{ steps.htmlproofer.outcome }} |" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------------
      # Stage 3: Publish (Only on main branch success)
      # ------------------------------------------------------------------------
      # Gated per step. A step `if:` without a status function also requires
      # every earlier step to have succeeded, so nothing is pushed unless the
      # build and all the tests above passed.
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' || inputs.force_publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and Push Immutable Image
        if: github.ref == 'refs/heads/main' || inputs.force_publish
        run: |
          IMAGE=${{ env.DOCKER_IMAGE }}
          TAG=${{ steps.tag.outputs.tag }}
          SOURCE_IMAGE=${{ steps.image.outputs.id }}
          
          echo "📦 Tagging image: ${IMAGE}:${TAG}"
          docker tag ${SOURCE_IMAGE} ${IMAGE}:${TAG}
          docker push ${IMAGE}:${TAG}
          
          echo "📦 Updating :latest tag"
          docker tag ${SOURCE_IMAGE} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          
          echo "## 🚀 Published Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE}:${TAG}\` (immutable)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE}:latest\` (updated)" >> $GITHUB_STEP_SUMMARY

      - name: Save Latest Tag Reference
        if: github.ref == 'refs/heads/main' || inputs.force_publish
        run: |
          echo "${{ steps.tag.outputs.tag }}" > LATEST_SUCCESSFUL_TAG

      - name: Upload Tag Reference
        if: github.ref == 'refs/heads/main' || inputs.force_publish
        uses: actions/upload-artifact@v7
        with:
          name: latest-tag
          path: LATEST_SUCCESSFUL_TAG
          retention-days: 90

  # ==========================================================================
  # Stage 4: Show Debug Info on Failure
  # ==========================================================================
  debug-failure:
    name: Debug Failure
    runs-on: ubuntu-latest
    needs: [build-test-publish]
    # A build or test failure only, as before the merge: once the tests have
    # passed, a failure is in the publish steps, not a dependency break.
    if: failure() && needs.build-test-publish.outputs.tests_outcome != 'success'
    
    steps:
      - name: Show Incompatibility Info
        run: |
          echo "## ❌ Build/Test Failed - Dependency Debug Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build failed with latest dependencies. Here's what was attempted:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Latest Ruby Version:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker run --rm ruby:slim ruby --version >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Latest Bundler Version:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker run --rm ruby:slim gem list bundler >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommended Actions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check if an upstream gem released a breaking change" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the build logs for specific error messages" >> $GITHUB_STEP_SUMMARY
          echo "3. As a last resort, temporarily pin the problematic gem" >> $GITHUB_STEP_SUMMARY
