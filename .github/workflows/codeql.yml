# Feature: ZER0-018
name: CodeQL Security Scanning

# Least-privilege default; the analyze job below grants exactly what it needs.
permissions:
  contents: read

# Path scope: the analyzable languages (js/ts/rb/py) plus the Actions
# definitions for the `actions` language. Deliberately NOT '**.yml' — data/
# content/config YAML contains nothing CodeQL analyzes, and that glob used to
# fan out all four language analyses on every _data/_config change.
# A newer commit on the same PR supersedes the in-flight analysis. Pushes to
# main and the weekly scan are never cancelled — the default branch's alert set
# is what the Security tab reads, so a half-finished scan must not replace it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.js'
      - '**.ts'
      - '**.rb'
      - '**.py'
      - '_plugins/**'
      - 'scripts/**'
      - 'lib/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.js'
      - '**.ts'
      - '**.rb'
      - '**.py'
      - '_plugins/**'
      - 'scripts/**'
      - 'lib/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '37 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: ruby
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.1
      with:
        category: "/language:${{matrix.language}}"
