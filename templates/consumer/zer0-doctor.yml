# =============================================================================
# zer0-doctor.yml — report-only zer0 stack contract check (consumer template)
# =============================================================================
#
# Copy to .github/workflows/zer0-doctor.yml in a site built on zer0-mistakes.
#
# A thin caller. The check itself — `zer0-cms doctor` — lives in bamr87/zer0-CMS
# and reports whether this site is aligned with the zer0 stack:
#
#   theme         remote_theme / theme names zer0-mistakes; .theme-overrides.yml
#   image-engine  the zer0-image-generator gem + one preview_images: block, and
#                 no vendored _plugins/preview_* fork or copied generator
#   cms           a zer0.json that parses, names a $schema, and whose content
#                 folders exist
#   fleet         fleet.manifest.yml (when present) is strict YAML
#   content       front matter parses; required keys from the theme's
#                 frontmatter_schema.yml (warnings only)
#
# Deliberately NOT on pull_request or push: it is a report, not a gate, and it
# must never redden a PR — least of all before the reusable workflow it calls
# exists. It runs weekly and on demand, and never fails the run
# (fail-on-error: false). Flip that to true only once the site reports clean.
#
# No model is called, no secret is read, nothing is written: it needs no
# *_ENABLED switch and no fleet.manifest.yml lane.
#
# Pick your own minute for the schedule so a fleet of consumers does not all
# fire at once.
# =============================================================================

name: zer0 doctor

on:
  workflow_dispatch:
  schedule:
    # Wednesdays 05:43 UTC — weekly; a non-zero minute keeps it off the hour.
    - cron: '43 5 * * 3'

permissions:
  contents: read

concurrency:
  group: zer0-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: zer0 stack contract (report-only)
    # A job that calls a reusable workflow cannot set timeout-minutes (GitHub
    # rejects the key there); the called workflow bounds its own job.
    uses: bamr87/zer0-CMS/.github/workflows/zer0-doctor.yml@main
    with:
      fail-on-error: false
