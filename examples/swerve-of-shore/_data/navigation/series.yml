# Reading-series sidebar for the Swerve of Shore example.
# Used by: sidebar `nav: series` (a collection default in _config.yml)
#
# Mirrors the category rail on swerveofshore.com. Every entry here resolves:
# pages/series/**.md generates a section page for the whole taxonomy, so an
# episode with no entries yet still lands on a real page rather than a 404.

