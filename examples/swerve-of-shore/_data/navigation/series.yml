# Reading-series sidebar for the Martello Notes example.
# Used by: sidebar `nav: series` (set as a collection default in _config.yml)
#
# Mirrors the reference site's category rail. Only entries that exist are
# listed here — the theme's nav renderer always emits an <a href>, so a
# curated link to an unwritten episode would be a dead link. The FULL
# 18-episode schedule lives in _data/episodes.yml and renders on each series
# index page via _includes/episode-schedule.html, where unwritten episodes
# show as plain "upcoming" rows instead.
#
# Add an entry here when you publish the matching episode.

- title: All Posts
  icon: bi-collection
  url: /blog/

- title: Ulysses
  icon: bi-book
  url: /series/ulysses/
  expanded: true
  children:
