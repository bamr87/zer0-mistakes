<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
     width="1200" height="630" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="g-card-map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ead9"/>
      <stop offset="1" stop-color="#c2b393"/>
    </linearGradient>
    <filter id="g-card-map-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
