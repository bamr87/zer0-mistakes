    <path d="M300 90 V560"/><path d="M600 90 V560"/><path d="M900 90 V560"/>
  </g>
  <g fill="#8a7358" opacity="0.85">
    <circle cx="300" cy="330" r="20"/><circle cx="600" cy="180" r="20"/>
    <circle cx="900" cy="480" r="20"/>
  </g>
  <path d="M300 330 L600 180 L900 480" fill="none" stroke="#8a7358"
        stroke-width="10" stroke-dasharray="26 20" opacity="0.85" stroke-linecap="round"/>
  <rect width="1200" height="630" filter="url(#g-card-map-grain)" opacity="0.06"/>
