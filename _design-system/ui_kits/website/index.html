<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  // Pull DS primitives onto window so the UI-kit scripts can use them as globals.
  const { Button, Badge, Card, FeatureCard, Callout, Input } = window.Zer0MistakesDesignSystem_e75121;
  Object.assign(window, { Button, Badge, Card, FeatureCard, Callout, Input });
</script>
<script type="text/babel" src="Navbar.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  function App() {
    const [theme, setTheme] = React.useState("light");
    const [skin, setSkin] = React.useState("default");

    React.useEffect(() => {
      const r = document.documentElement;
      r.setAttribute("data-bs-theme", theme);
      if (skin === "default") r.removeAttribute("data-theme-skin");
      else r.setAttribute("data-theme-skin", skin);
    }, [theme, skin]);

    return (
      <React.Fragment>
        <Navbar theme={theme} onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
                skin={skin} onSkin={setSkin} />
        <Hero />
        <QuickLinks />
        <Features />
        <GetStarted />
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
