<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body { margin: 0; font-family: var(--zer0-font-sans); color: var(--zer0-color-ink);
         background: var(--zer0-color-bg); padding: 22px; }
  h4 { margin: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: .04em;
       text-transform: uppercase; color: var(--zer0-color-ink-muted); }
  .icons { display: flex; gap: 22px; flex-wrap: wrap; }
  .ic { text-align: center; width: 78px; }
  .ic i { font-size: 26px; color: var(--zer0-color-primary); }
  .ic .nm { font-family: var(--zer0-font-mono); font-size: 10px; color: var(--zer0-color-ink-muted); margin-top: 8px; }
  .chip { width: 56px; height: 56px; border-radius: 50%; display: inline-flex;
          align-items: center; justify-content: center; margin-bottom: 4px;
          background: rgba(var(--zer0-color-primary-rgb), .12); }
  .chip i { font-size: 24px; }
</style>
</head>
<body>
  <h4>Bootstrap Icons · <span style="text-transform:none;font-weight:400"><i>&lt;i class="bi bi-name"&gt;</i></span></h4>
  <div class="icons">
    <div class="ic"><span class="chip"><i class="bi bi-rocket-takeoff"></i></span><div class="nm">rocket-takeoff</div></div>
    <div class="ic"><span class="chip"><i class="bi bi-shield-check"></i></span><div class="nm">shield-check</div></div>
    <div class="ic"><span class="chip"><i class="bi bi-boxes"></i></span><div class="nm">boxes</div></div>
    <div class="ic"><span class="chip"><i class="bi bi-lightning-charge"></i></span><div class="nm">lightning</div></div>
    <div class="ic"><i class="bi bi-search"></i><div class="nm">search</div></div>
    <div class="ic"><i class="bi bi-gear"></i><div class="nm">gear</div></div>
    <div class="ic"><i class="bi bi-github"></i><div class="nm">github</div></div>
    <div class="ic"><i class="bi bi-journal-richtext"></i><div class="nm">journal</div></div>
  </div>
</body>
</html>
