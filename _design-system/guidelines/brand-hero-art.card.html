<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--zer0-font-sans); color: var(--zer0-color-ink);
         background: var(--zer0-color-bg); padding: 0; }
  .wrap { display: flex; gap: 0; height: 300px; }
  .art { flex: 1; background-size: cover; background-position: center; }
  .a1 { background-image: url("../assets/images/wizard-on-journey.png"); }
  .a2 { background-image: url("../assets/images/zer0-mistakes-wizard.png"); }
  .cap { position: absolute; left: 16px; bottom: 14px; color: #fff;
         font-size: 12px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <div class="wrap" style="position:relative">
    <div class="art a1"></div>
    <div class="art a2"></div>
    <div class="cap">Painterly + pixel-art registers · warm golds, ambient blues, retro-computing</div>
  </div>
</body>
</html>
